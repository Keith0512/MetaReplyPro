name: Verify v1.5.4 on Windows PowerShell 5.1

on:
  push:
    branches:
      - codex/verify-windows-v154

permissions:
  contents: read

jobs:
  windows:
    name: Verify the signed Windows reinstall and Chrome bridge
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test in Windows PowerShell 5.1 and Chrome
        shell: powershell
        run: .\updater\tests\windows-v154-smoke.ps1
