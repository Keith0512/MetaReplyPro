<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>META AutoReply</title>
  <style>
    body {
      width: 260px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f8fafc;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 8px 0;
      color: #4f46e5;
      font-size: 18px;
    }
    p {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background-color: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>
  <h3>🤖 META AutoReply</h3>
  <p>點擊下方按鈕開啟控制面板，設定您的商品連結與防封鎖回覆範本。</p>
  <a href="settings.html" target="_blank" class="btn">⚙️ 開啟控制面板</a>
</body>
</html>
